<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- No zoom of any kind: the canvas is fitted by --fit, so browser zoom
     (pinch/double-tap/user-scalable) only misaligns it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#ffffff" />
    <title><!--title--></title>
    <script>
      /* Size the fixed design canvas (2200x1650) to the real viewport before first
   paint, so the panel never flashes at the wrong scale; resize keeps it in
   sync. Ported verbatim from the previous render.mjs. */
      (function () {
        function fit() {
          var s = Math.min(window.innerWidth / 2200, window.innerHeight / 1650);
          document.documentElement.style.setProperty("--fit", s);
        }
        fit();
        window.addEventListener("resize", fit);
      })();
    </script>
    <script>
      /* Zoom guards, second layer after the viewport meta and epaper.css
   touch-action: Firefox kiosk zoom is the DEFAULT ACTION of the touch
   events, so a non-passive preventDefault() cancels the zoom itself.
   Covers pinch (2+ touches), double-tap zoom (two taps on the same spot
   inside 350ms — far apart taps stay clickable), and ctrl+wheel. */
      (function () {
        ["touchstart", "touchmove"].forEach(function (ev) {
          window.addEventListener(
            ev,
            function (e) {
              if (e.touches.length > 1) e.preventDefault();
            },
            { passive: false },
          );
        });
        var lastTap = 0;
        var lastX = 0;
        var lastY = 0;
        window.addEventListener(
          "touchend",
          function (e) {
            var t = e.changedTouches[0];
            if (e.touches.length > 0 || !t) return;
            var now = Date.now();
            if (
              now - lastTap < 350 &&
              Math.abs(t.clientX - lastX) < 40 &&
              Math.abs(t.clientY - lastY) < 40
            ) {
              e.preventDefault();
              lastTap = 0;
            } else {
              lastTap = now;
              lastX = t.clientX;
              lastY = t.clientY;
            }
          },
          { passive: false },
        );
        window.addEventListener(
          "wheel",
          function (e) {
            if (e.ctrlKey) e.preventDefault();
          },
          { passive: false },
        );
      })();
    </script>
    <script>
      /* Idle cursor hide: nobody is at the cage kiosk's mouse, so the system
   pointer just sits mid-screen and reads as a stuck artifact on the e-paper.
   The class blanks the cursor via epaper.css (which outranks button's
   cursor: pointer); any mouse activity reveals it again and 3s of quiet
   re-hides it, so desktop previews keep a usable pointer. Starts hidden —
   the kiosk never moves the mouse, so it must never show the cursor. */
      (function () {
        var root = document.documentElement;
        var t = 0;
        function hide() {
          root.classList.add("hide-cursor");
        }
        ["mousemove", "mousedown", "wheel"].forEach(function (ev) {
          window.addEventListener(ev, function () {
            root.classList.remove("hide-cursor");
            clearTimeout(t);
            t = setTimeout(hide, 3000);
          });
        });
        hide();
      })();
    </script>
    <!-- The stylesheet is a plain <link>, NOT a JS import: with JavaScript off
     the page must still be readable AND styled (SSR-first contract). Vite
     rewrites it to the hashed asset in the prod build. -->
    <link rel="stylesheet" href="/src/styles/epaper.css" />
    <script type="module" src="/src/entry-client.ts"></script>
  </head>
  <body>
    <!-- .viewport/.screen stay outside Vue: the hydrate root is #app itself, so
     <header> and .body land as DIRECT children of the .screen grid (App.vue
     is a two-root fragment on purpose). -->
    <div class="viewport">
      <div id="app" class="screen"><!--app-html--></div>
    </div>
    <!-- Bootstrap state: the exact PanelState the SSR pass consumed. -->
    <script type="application/json" id="panel-state">
      <!--state-->
    </script>
  </body>
</html>
