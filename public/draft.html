<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- Kiosk target: 2200x1650 e-paper, 1 CSS px = 1 physical px. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<title>Mira Panel</title>
<style>
  /* ------------------------------------------------------------------
     Design rules for the BOOX Mira e-paper panel:
       - pure #000 on #fff only, no greys, no shadows, no gradients
       - zero animation/transition => a tap repaints only what changed
       - every interactive block >= 600x600 px => comfortable finger targets
       - single HTML file, no fonts/images/JS to download => lightest load
     ------------------------------------------------------------------ */
  * { box-sizing: border-box; margin: 0; padding: 0;
      transition: none !important; animation: none !important; }

  html, body {
    height: 100%;
    background: #fff;
    color: #000;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Noto Sans SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  .screen { height: 100vh; display: grid; grid-template-rows: 150px 1fr 86px; }

  header, footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px;
  }
  header { border-bottom: 6px solid #000; }
  footer { border-top: 6px solid #000; font-size: 30px; }

  h1 { font-size: 56px; font-weight: 900; letter-spacing: 3px; }
  .stamp { font-size: 34px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 26px;
    padding: 26px;
  }

  .card {
    border: 6px solid #000;
    padding: 34px 38px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  /* Instant inversion as touch feedback: one black fill, no fade. */
  .card:active { background: #000; color: #fff; }

  .card h2 { font-size: 58px; font-weight: 900; letter-spacing: 2px; }
  .card .figure { font-size: 132px; font-weight: 900; line-height: 1; }
  .card .note { font-size: 32px; }

  .placeholder { font-size: 26px; opacity: 1; }
</style>
</head>
<body>
<div class="screen">

  <header>
    <h1>MIRA PANEL ／ 面板草案</h1>
    <div class="stamp">2200 × 1650 ・ 1-bit ・ v0</div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>待办</h2>
      <div class="figure">3</div>
      <div class="note">今日到期 ・ Vikunja</div>
    </section>

    <section class="card">
      <h2>日程</h2>
      <div class="figure">2</div>
      <div class="note">接下来 09:30 / 14:00</div>
    </section>

    <section class="card">
      <h2>阅读</h2>
      <div class="figure">7</div>
      <div class="note">未读书签 ・ Readeck</div>
    </section>

    <section class="card">
      <h2>资讯</h2>
      <div class="figure">10</div>
      <div class="note">HN 精选 ・ RSS 分流</div>
    </section>

    <section class="card">
      <h2>白板</h2>
      <div class="figure">✎</div>
      <div class="note">便签 / 手写区（待设计）</div>
    </section>

    <section class="card">
      <h2>状态</h2>
      <div class="figure">●</div>
      <div class="note">服务、电量、刷新模式</div>
    </section>
  </main>

  <footer>
    <div>草案 v0 ・ 全部为假数据，用来讨论布局与信息密度</div>
    <div class="placeholder">触摸任意区块 → 立即反色（无常动画）</div>
  </footer>

</div>
</body>
</html>
